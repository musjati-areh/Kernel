name: Build Kernel 4.19 with KernelSU

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Kernel (mi439)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow & Sources
        uses: actions/checkout@v4

      - name: Install Fast Dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libelf-dev libssl-dev bc bison flex zip python3 cpio

      - name: Restore Proton Clang Cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-v1

      - name: Clone Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Integrate KernelSU-Next & Apply Source Patches
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          # Патчи трассировки планировщика (устранение несовместимостей sched.h)
          if [ -f include/trace/events/sched.h ]; then
            sed -i 's/runnable_load_avg/runnable_avg/g' include/trace/events/sched.h
            sed -i '/__entry->cpu_load/ s/=.*/= 0;/g' include/trace/events/sched.h
            sed -i '/__entry->idle_state/ s/=.*/= 0;/g' include/trace/events/sched.h
            sed -i '/__entry->isolated/ s/=.*/= 0;/g' include/trace/events/sched.h
          fi

          # Патч task_mmu (исправление опечатки reclaim_walk_ops -> reclaim_walk)
          if [ -f fs/proc/task_mmu.c ]; then
            sed -i 's/reclaim_walk_ops/reclaim_walk/g' fs/proc/task_mmu.c
          fi

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Определение дефконфига SDM439 / MI439
          if [ -f arch/arm64/configs/vendor/sdm439-perf_defconfig ]; then
            DEFCONFIG="vendor/sdm439-perf_defconfig"
          elif [ -f arch/arm64/configs/vendor/sdm439_defconfig ]; then
            DEFCONFIG="vendor/sdm439_defconfig"
          elif [ -f arch/arm64/configs/sdm439-perf_defconfig ]; then
            DEFCONFIG="sdm439-perf_defconfig"
          elif [ -f arch/arm64/configs/vendor/mi439-perf_defconfig ]; then
            DEFCONFIG="vendor/mi439-perf_defconfig"
          elif [ -f arch/arm64/configs/lolz_defconfig ]; then
            DEFCONFIG="lolz_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs -name "*439*" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi
          
          echo "Using defconfig: $DEFCONFIG"

          if [ -f arch/arm64/configs/vendor/xiaomi-sdm439.config ]; then
            cat arch/arm64/configs/vendor/xiaomi-sdm439.config >> arch/arm64/configs/$DEFCONFIG
          fi
          
          cat << 'EOF' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KSU=y
          CONFIG_OVERLAY_FS=y
          CONFIG_WERROR=n
          CONFIG_EROFS_FS=n
          CONFIG_EROFS_FS_DEBUG=n
          EOF

          make O=out ARCH=arm64 CC=clang $DEFCONFIG
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            KCFLAGS="-Wno-error" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip 2>&1 | tee build.log || {
              echo "=== НАЙДЕННЫЕ ОШИБКИ КОМПИЛЯЦИИ ==="
              grep -iE "error:|undefined reference|fatal error:" build.log | tail -n 35
              exit 1
            }

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|g' AnyKernel3/anykernel.sh
          
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          zip -r9 ../Kernel-KSU-mi439.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-KSU-mi439
          path: Kernel-KSU-mi439.zip
